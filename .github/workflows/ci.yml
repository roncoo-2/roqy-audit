name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python syntax + harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Syntax check all python files
        run: find . -name '*.py' | xargs -n1 python3 -m py_compile
      - name: Harness smoke (usage output, no crash)
        run: python3 harness/run_audit_harness.py 2>&1 | head -3

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-security:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  md-agent-safety:
    name: Markdown agent-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan skill/report markdown for prompt-injection and destructive patterns
        run: |
          ! grep -rInE \
            '(ignore (all )?(previous|prior) instructions|disregard (all|your) instructions|you are now|act as (if|an)|system prompt|exfiltrate|curl[^|]*\|[[:space:]]*(ba)?sh|wget[^|]*\|[[:space:]]*(ba)?sh|base64[[:space:]]+-d[[:space:]].*\|[[:space:]]*(ba)?sh|rm[[:space:]]+-rf[[:space:]]+/|chmod[[:space:]]+777[[:space:]]+/)' \
            --include='*.md' .
      - name: Scan markdown for unexpected external URLs
        run: |
          ! grep -rIhoE 'https?://[a-zA-Z0-9./_-]+' --include='*.md' . \
            | grep -vE 'github.com|roqy.io|agentskills.io|cloudflare|floci-io|storage.googleapis.com|monitoring.googleapis.com|amazonaws.com|<'
